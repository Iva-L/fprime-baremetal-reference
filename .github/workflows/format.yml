name: F' Style & Format Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install F' Formatting Tools
        run: |
          pip install fprime-cli

      - name: Run Format Check
        run: |
          # Checks files against F' style rules
          fprime-util format --check