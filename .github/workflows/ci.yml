name: STM32H7 Baremetal F' CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-stm32h7:
    name: Cross-Compile STM32H7 Baremetal Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Crucial to pull fprime-baremetal and fprime submodules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev

      - name: Install F' Tools
        run: |
          python -m pip install --upgrade pip
          pip install fprime-tools fprime-fpp

      - name: Verify Environment
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version

      - name: Generate CMake Cache
        run: |
          # Generates build files targeting stm32h7 baremetal platform
          fprime-util generate stm32h7

      - name: Cross-Compile F' Binary
        run: |
          # Builds the ReferenceDeployment executable
          fprime-util build stm32h7